<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>宅建知識</title>

</head>


<body>

<main>

<h1>宅建知識</h1>

<h2>宅建業法</h2>
<ul class="knowledge-list">

<li class="item" data-id="1">

    <input
        class="item-check"
        type="checkbox"
    >

    <span class="front">
        宅建士証の有効期間は
    </span>

    <span
        class="answer"
        tabindex="0"
        role="button"
    >
        5
    </span>

    <span class="back">
        年。
    </span>

</li>


<li class="item" data-id="2">

    <input
        class="item-check"
        type="checkbox"
    >

    <span class="front">
        宅建業免許の有効期間は
    </span>

    <span
        class="answer"
        tabindex="0"
        role="button"
    >
        5
    </span>

    <span class="back">
        年。
    </span>

</li>


<li class="item" data-id="4">

    <input
        class="item-check"
        type="checkbox"
    >

    <span class="front">
        宅建業者は、事務所ごとに専任の宅建士を
    </span>

    <span
        class="answer"
        tabindex="0"
        role="button"
    >
        1
    </span>

    <span class="back">
        人以上置く。
    </span>

</li>

</ul>
<h2>民法</h2>
<ul class="knowledge-list">

<li class="item" data-id="3">

    <input
        class="item-check"
        type="checkbox"
    >

    <span class="front">
        成年年齢は
    </span>

    <span
        class="answer"
        tabindex="0"
        role="button"
    >
        18
    </span>

    <span class="back">
        歳。
    </span>

</li>

</ul>

</main>


<!-- 加载你原来的 JavaScript -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script type="module" src="app.js"></script>

</body>

</html>
