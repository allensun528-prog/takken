<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>宅建知識</title>


<style>

/* =========================
   答案隐藏 / 显示
   ========================= */

.answer {
    color: transparent;
    background: #ddd;
    cursor: pointer;
    border-radius: 3px;
    padding: 0 8px;
}

.answer.show {
    color: inherit;
    background: transparent;
}


/* =========================
   基本样式
   ========================= */

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    line-height: 1.6;
}

.knowledge-list {
    padding-left: 0;
}

.item {
    list-style: none;
    margin: 8px 0;
}

.item-check {
    margin-right: 8px;
}

.front {
    margin-right: 4px;
}

.back {
    margin-left: 4px;
}

h2 {
    margin-top: 30px;
}

</style>

</head>


<body>

<main>

<h1>宅建知識</h1>

<h2>宅建業法</h2>
<ul class="knowledge-list">

<li class="item" data-id="1">

    <input
        class="item-check"
        type="checkbox"
    >

    <span class="front">
        宅建士証の有効期間は
    </span>

    <span
        class="answer"
        tabindex="0"
        role="button"
    >
        5
    </span>

    <span class="back">
        年。
    </span>

</li>


<li class="item" data-id="2">

    <input
        class="item-check"
        type="checkbox"
    >

    <span class="front">
        宅建業免許の有効期間は
    </span>

    <span
        class="answer"
        tabindex="0"
        role="button"
    >
        5
    </span>

    <span class="back">
        年。
    </span>

</li>


<li class="item" data-id="4">

    <input
        class="item-check"
        type="checkbox"
    >

    <span class="front">
        宅建業者は、事務所ごとに専任の宅建士を
    </span>

    <span
        class="answer"
        tabindex="0"
        role="button"
    >
        1
    </span>

    <span class="back">
        人以上置く。
    </span>

</li>

</ul>
<h2>民法</h2>
<ul class="knowledge-list">

<li class="item" data-id="3">

    <input
        class="item-check"
        type="checkbox"
    >

    <span class="front">
        成年年齢は
    </span>

    <span
        class="answer"
        tabindex="0"
        role="button"
    >
        18
    </span>

    <span class="back">
        歳。
    </span>

</li>

</ul>
<ul class="knowledge-list">

<li class="item" data-id="5">

    <input
        class="item-check"
        type="checkbox"
    >

    <span class="front">
        测试
    </span>

    <span
        class="answer"
        tabindex="0"
        role="button"
    >
        答案
    </span>

    <span class="back">
        
    </span>

</li>

</ul>

</main>


<!-- Firebase / app.js -->

<script
    type="module"
    src="app.js"
></script>

</body>

</html>
